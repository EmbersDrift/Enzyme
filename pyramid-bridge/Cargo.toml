[package]
name = "embers-pyramid"
version = "0.2.2"
edition = "2021"
license = "MIT"

[lib]
name = "pyramid_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
image = "0.24"
fs_extra = "1.3"
tempfile = "3.10.1"
zip = "0.6"
chrono = "0.4"
regex = "1"
base64 = "0.22"
flate2 = "1.0"
lazy_static = "1"
rayon = "1.9"
uuid = { version = "1.8", features = ["v4", "serde"] }

[profile.release]
strip = true

